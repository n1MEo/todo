<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:wght@500&family=Sansita+Swashed:wght@300..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <div id="form">
            <p id="maintext">TODO LIST</p>
            <input type="text" id="finder-light" placeholder=" Search note...">
            <button type="submit" id="btnfind"><img src="photos/Vector.svg"></button>
            <select id="spisok">
                <option>ALL</option>
                <option>DONE</option>
                <option>ONGOING</option>
            </select>
            <button type="button" id="themeToggle"><img id="ThemeIcon" src="photos/moon.svg"></button>
            <div class="box_for_tasks">
                <img src="photos/Detective-check-footprint 1.png" id="empty">
                <p id="emt_txt">Empty...</p>
            </div> 
        </div>
        <button id="add_task"><img src=photos/plus.png style="width: 50%; height: 50%;"></button>
        </div>
    </main>
    <div class="modale_window">
        <div id="modale_content">
            <p id="maintext">NEW LIST</p>
            <input type="text" id="task_name" placeholder="input your note...">
            <div id="buttons_box">
                <button id="cancel">CANCEL</button>
                <button id="apply">APPLY</button>
            </div>
        </div>
    </div>
    <div class="background_box"></div>

</body>
<script src="script.js"></script>

</html>
