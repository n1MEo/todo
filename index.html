<body>
    <main>
        <form>
            <p id="maintext">TODO LIST</p>

            <select id="spisok">
                <option>ALL</option>
                <option>DONE</option>
                <option>ONGOING</option>
            </select>
            <button type="button" id="themeToggle"><img id="ThemeIcon" src="photos/moon.svg"></button>
            <div class="tasklist">
                <div style="display: flex; gap: 20px;">
                    <input type="checkbox" class="task">
                    <p class="task_text">Сделать сальто</p>
                </div>
                <hr>
            </div>
            <div class="tasklist">
                <div style="display: flex; gap: 20px;">
                    <input type="checkbox" class="task">
                    <p class="task_text">Убраться в комнате</p>
                </div>
                <hr>
            </div>
            <div class="tasklist">
                <div style="display: flex; gap: 20px;">
                    <input type="checkbox" class="task">
                    <p class="task_text">Сверстать макет</p>
                </div>
                <hr>
            </div>

    </main>
